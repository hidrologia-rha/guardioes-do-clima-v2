<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guardiões do Clima — jogo educativo de climatologia para o 6º ano.">
<title>Guardiões do Clima — A Missão das Quatro Estações</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/interface.css">
<link rel="stylesheet" href="styles/game.css">
<link rel="stylesheet" href="styles/animations.css">
</head>
<body>
<canvas id="game" aria-label="Mundo do jogo. Use WASD ou setas para andar e E para interagir."></canvas>

<section id="screen-title" class="screen">
  <canvas id="title-bg" aria-hidden="true"></canvas>
  <div class="title-box">
    <p class="title-kicker">Uma aventura científica no arquipélago de Aurora</p>
    <h1 class="title-logo">Guardiões<span>do Clima</span></h1>
    <p class="title-sub">A Missão das Quatro Estações</p>
    <div class="title-menu">
      <button class="btn btn-primary" id="btn-new">Novo jogo</button>
      <button class="btn" id="btn-continue">Continuar</button>
      <button class="btn" id="btn-settings-title">Configurações</button>
      <button class="btn btn-ghost" id="btn-about">Para professores</button>
    </div>
  </div>
</section>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="hud-chapter" id="hud-chapter"></div>
    <div class="hud-objective"><span class="obj-label">Objetivo</span><span id="hud-objective"></span></div>
    <div class="hud-weather" id="hud-weather" aria-live="polite"></div>
  </div>
  <nav class="hud-right" aria-label="Menu do jogo">
    <button class="hud-btn" data-panel="missions" aria-label="Missões (Q)"><span class="ico" data-icon="flag"></span><span class="lbl">Missões</span><kbd>Q</kbd></button>
    <button class="hud-btn" data-panel="journal" aria-label="Diário científico (J)"><span class="ico" data-icon="book"></span><span class="lbl">Diário</span><kbd>J</kbd></button>
    <button class="hud-btn" data-panel="inventory" aria-label="Mochila (I)"><span class="ico" data-icon="bag"></span><span class="lbl">Mochila</span><kbd>I</kbd></button>
    <button class="hud-btn" data-panel="map" aria-label="Mapa do arquipélago (M)"><span class="ico" data-icon="map"></span><span class="lbl">Mapa</span><kbd>M</kbd></button>
    <button class="hud-btn" data-panel="pause" aria-label="Pausa (Esc)"><span class="ico" data-icon="pause"></span><span class="lbl">Pausa</span><kbd>Esc</kbd></button>
  </nav>
</div>

<div id="dialogue" hidden>
  <div class="dlg-portrait"><canvas id="portrait" width="200" height="200" aria-hidden="true"></canvas></div>
  <div class="dlg-body">
    <div class="dlg-name" id="dlg-name"></div>
    <div class="dlg-text" id="dlg-text" aria-live="polite"></div>
    <div class="dlg-choices" id="dlg-choices"></div>
    <div class="dlg-next" id="dlg-next">Continuar ▸ <kbd>E</kbd></div>
  </div>
</div>

<div id="modal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <button class="panel-close" id="panel-close" aria-label="Fechar">×</button>
    <div class="panel-content" id="panel-content"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="captions" aria-live="polite"></div>

<div id="touch" hidden>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <button id="btn-act" aria-label="Interagir">E</button>
</div>

<div id="fade"></div>

<!-- Conteúdo (dados) -->
<script src="data/asset-manifest.js"></script>
<script src="data/educational-content.js"></script>
<script src="data/dialogues.js"></script>
<script src="data/challenges.js"></script>
<script src="data/chapters.js"></script>
<!-- Motor -->
<script src="src/persistence.js"></script>
<script src="src/progression.js"></script>
<script src="src/missions.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/art.js"></script>
<script src="src/camera.js"></script>
<script src="src/collision.js"></script>
<script src="src/player.js"></script>
<script src="src/world.js"></script>
<script src="src/dialogue.js"></script>
<script src="src/challenges.js"></script>
<script src="src/climate-lab.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
